name: Refresh profile cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "profile.json", ".github/workflows/cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the cards and the Selected work section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/cards.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Refresh profile cards"
          # Point the README at the commit that holds the cards: raw.githubusercontent.com
          # caches branch URLs for hours in some regions, commit URLs never go stale.
          sha=$(git log -1 --format=%H -- assets)
          sed -i -E "s#src=\"(assets/|https://github\.com/${GITHUB_REPOSITORY}/raw/[0-9a-f]{40}/assets/)#src=\"https://github.com/${GITHUB_REPOSITORY}/raw/${sha}/assets/#g" README.md
          git add README.md
          git diff --cached --quiet || git commit -m "Point the README at the refreshed cards"
          git push
